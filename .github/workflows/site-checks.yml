name: Site checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          for script in js/*.js cookie-consent.js; do
            node --check "$script"
          done
      - name: Test contact and navigation behaviour
        run: node --test tests/*.test.cjs
      - name: Validate static pages and local links
        run: python3 scripts/check_site.py
      - name: Test release verification boundaries
        run: python3 -B -m unittest discover -s tests -p '*_test.py'
