name: Verify public release

on:
  workflow_run:
    workflows: ['Site checks']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-public-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Wait for Pages at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait_for_pages.py
      - name: Verify public files, redirect and 404
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_release.py
